<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="530" viewBox="0 0 880 265" role="img" aria-label="Come build with us. See open roles.">
  <defs>
    <clipPath id="cta-clip">
      <rect width="880" height="265" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#cta-clip)">
    <rect width="880" height="265" rx="24" fill="#DDE048"/>
    <rect x="-36" y="-36" width="120" height="120" rx="24" fill="none" stroke="#151515" stroke-opacity="0.16" stroke-width="4" transform="rotate(15 24 24)"/>
    <rect x="774" y="167" width="150" height="150" rx="30" fill="none" stroke="#151515" stroke-opacity="0.16" stroke-width="4" transform="rotate(15 849 242)"/>
